<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trademark Certificate Generator</title>

<style>

body{
font-family:Times New Roman;
background:#0f172a;
color:white;
margin:0;
display:flex;
flex-direction:column;
align-items:center;
}

.container{
display:flex;
flex-direction:column;
width:95%;
max-width:900px;
margin-top:20px;
}

input,textarea{
width:100%;
padding:8px;
margin:6px 0;
border-radius:6px;
border:none;
}

button{
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.preview{
margin-top:30px;
}

#certificate{

width:794px;
height:1123px;
background:white;
color:black;
padding:60px;
box-shadow:0 0 10px rgba(0,0,0,0.5);

}

.center{text-align:center;}

.logo{
width:120px;
margin:auto;
display:block;
}

.footer{
display:flex;
justify-content:space-between;
margin-top:120px;
}

</style>
</head>

<body>

<div class="container">

<h2>Trademark Certificate Generator</h2>

<label>Form Name</label>
<input id="formname" oninput="update()" value="TMR-1 Form">

<label>Certificate Title</label>
<input id="title" oninput="update()" value="Certificate of Registration of Trademark">

<label>Trademark No</label>
<input id="tmno" oninput="update()">

<label>Registration Date</label>
<input id="regdate" oninput="update()">

<label>Owner / Company</label>
<input id="owner" oninput="update()">

<label>Address</label>
<textarea id="address" oninput="update()"></textarea>

<label>Service Description</label>
<textarea id="service" oninput="update()"></textarea>

<label>Signatory</label>
<input id="signatory" oninput="update()">

<label>Designation</label>
<input id="designation" oninput="update()">

<label>Upload Logo</label>
<input type="file" id="logoUpload" onchange="logoPreview(event)">

<button onclick="downloadPDF()">Download PDF</button>

</div>

<div class="preview">

<div id="certificate">

<div style="display:flex;justify-content:space-between;">
<div id="pform">TMR-1 Form</div>
<div>Serial No.</div>
</div>

<h2 class="center">Government Certificate</h2>

<h3 class="center" id="ptitle">
Certificate of Registration of Trademark
</h3>

<div style="display:flex;justify-content:space-between;margin-top:20px;">
<div>Trademark No: <span id="ptmno"></span></div>
<div>Date: <span id="pregdate"></span></div>
</div>

<p style="margin-top:40px;" id="pbody">
</p>

<img id="logo" class="logo">

<div class="footer">

<div>
Sealed at my direction
</div>

<div>
<div id="psign"></div>
<div id="pdes"></div>
</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

function update(){

document.getElementById("pform").innerText =
document.getElementById("formname").value

document.getElementById("ptitle").innerText =
document.getElementById("title").value

document.getElementById("ptmno").innerText =
document.getElementById("tmno").value

document.getElementById("pregdate").innerText =
document.getElementById("regdate").value

let owner=document.getElementById("owner").value
let address=document.getElementById("address").value
let service=document.getElementById("service").value

document.getElementById("pbody").innerText=
"Certified that the Trademark of "+owner+
" located at "+address+
" for services: "+service

document.getElementById("psign").innerText=
document.getElementById("signatory").value

document.getElementById("pdes").innerText=
document.getElementById("designation").value

}

function logoPreview(event){

let reader=new FileReader()

reader.onload=function(){

document.getElementById("logo").src=reader.result

}

reader.readAsDataURL(event.target.files[0])

}

async function downloadPDF(){

const { jsPDF } = window.jspdf

html2canvas(document.getElementById("certificate")).then(canvas=>{

let img=canvas.toDataURL("image/png")

let pdf=new jsPDF("p","mm","a4")

pdf.addImage(img,"PNG",0,0,210,297)

pdf.save("certificate.pdf")

})

}

</script>

</body>
</html>
