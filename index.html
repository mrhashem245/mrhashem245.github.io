<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thermex Trademark Certificate Generator</title>
<style>
body{
    font-family:"Times New Roman", serif;
    display:flex;
    gap:20px;
    padding:20px;
    background:#f0f0f0;
}

.controls{
    width:350px;
}

.controls input, .controls textarea, .controls select{
    width:100%;
    padding:5px;
    margin:5px 0;
}

.controls button{
    margin-top:10px;
    padding:8px;
    cursor:pointer;
}

.preview{
    width:210mm;
    height:297mm;
    border:1px solid #000;
    position:relative;
    background:white;
    box-sizing:border-box;
    padding:20mm;
}

.logo, #trademarkLogo{
    display:block;
}

.leftLogo{
    position:absolute;
    top:50mm;
    left:35mm;
    width:80px;
    height:80px;
}

.rightLogo{
    position:absolute;
    top:50mm;
    right:35mm;
    width:80px;
    height:80px;
}

#trademarkLogo{
    position:absolute;
    top:190mm;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    height:120px;
}

.trendmark{
    position:absolute;
    top:105mm;
    left:30mm;
    font-weight:bold;
    font-size:16px;
}

.date{
    position:absolute;
    top:105mm;
    right:30mm;
    font-size:16px;
}

.bodyText{
    position:absolute;
    top:120mm;
    left:35mm;
    width:140mm;
    line-height:1.6;
    font-size:16px;
}

.brandName{
    position:absolute;
    top:225mm;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
}

.sealDate{
    position:absolute;
    top:240mm;
    left:35mm;
    font-size:14px;
}

.signature{
    position:absolute;
    top:240mm;
    right:35mm;
}

.signatureName{
    font-size:16px;
    font-weight:bold;
}

.signatureTitle{
    font-size:14px;
}

.footerText{
    position:absolute;
    top:265mm;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
}

.qrCode{
    position:absolute;
    top:255mm;
    right:30mm;
    width:90px;
    height:90px;
}

.governmentTitle{
    position:absolute;
    top:35mm;
    left:50%;
    transform:translateX(-50%);
    font-size:26px;
    font-weight:bold;
    text-align:center;
}

.departmentName{
    position:absolute;
    top:48mm;
    left:50%;
    transform:translateX(-50%);
    font-size:16px;
    text-align:center;
}

.certificateTitle{
    position:absolute;
    top:85mm;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;
    font-weight:bold;
    text-align:center;
}

.formName{
    position:absolute;
    top:20mm;
    left:25mm;
    font-size:14px;
}

.serialNo{
    position:absolute;
    top:20mm;
    right:25mm;
    font-size:14px;
}
</style>
</head>
<body>

<div class="controls">
<h3>Certificate Input Panel</h3>

<label>Form Name</label>
<input id="formNameInput" value="TMR-1 Form">

<label>Serial No</label>
<input id="serialNoInput">

<label>Government Title</label>
<input id="govTitleInput" value="Government of the People's Republic of Bangladesh">

<label>Department Name</label>
<input id="deptNameInput" value="Department of Patents, Designs & Trade Marks Ministry of Industries, Shilpa Bhaban, Dhaka-1000.">

<label>Certificate Title</label>
<input id="certTitleInput" value="Certificate of Registration of Trademark [Rule 30(1)]">

<label>Trendmark No.</label>
<input type="text" id="trendmark" readonly>
<button onclick="generateTrendmark()">R</button>

<label>Registration Date</label>
<input id="regDateInput" type="date">

<label>Seal Date</label>
<input id="sealDateInput" type="date">

<label>Owner / Company</label>
<input id="ownerInput">

<label>Address</label>
<textarea id="addressInput" rows="3"></textarea>

<label>Service Description</label>
<textarea id="serviceInput" rows="3"></textarea>

<label>Trademark Logo Upload</label>
<input type="file" id="trademarkLogoInput">

<label>Left Logo Upload</label>
<input type="file" id="leftLogoInput">

<label>Right Logo Upload</label>
<input type="file" id="rightLogoInput">

<label>Brand Name</label>
<input id="brandNameInput">

<label>Seal Text</label>
<input id="sealTextInput" value="Sealed at my direction this">

<label>Signature Name</label>
<input id="sigNameInput" value="Md Emdadul Haque">

<label>Designation</label>
<input id="sigTitleInput" value="Director General Deputy Reg Department of Patents, Designs and Trademarks">

<label>Footer Text</label>
<input id="footerInput" value="Registration is given for 7 years... (See Section 22 of the Trademarks Act, 2005)">

<button onclick="updatePreview()">Update Preview</button>
<button onclick="downloadPDF()">Download PDF</button>
</div>

<div class="preview" id="preview">

<div class="formName" id="pformName"></div>
<div class="serialNo" id="pserialNo"></div>
<div class="governmentTitle" id="pGovTitle"></div>
<div class="departmentName" id="pDeptName"></div>
<div class="certificateTitle" id="pCertTitle"></div>

<div class="trendmark">Trendmark No: <span id="ptrendmark"></span></div>
<div class="date" id="pRegDate"></div>

<div class="bodyText" id="pBodyText"></div>

<img id="trademarkLogo" src="">
<img class="leftLogo" id="pLeftLogo" src="">
<img class="rightLogo" id="pRightLogo" src="">

<div class="brandName" id="pBrandName"></div>
<div class="sealDate" id="pSealDate"></div>
<div class="signature">
    <div class="signatureName" id="pSigName"></div>
    <div class="signatureTitle" id="pSigTitle"></div>
</div>

<div class="footerText" id="pFooter"></div>
<div class="qrCode" id="pQRCode"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// Generate random Trendmark No
function generateTrendmark(){
    let randomNumber = Math.floor(100000 + Math.random()*900000);
    document.getElementById("trendmark").value = randomNumber;
    updatePreview();
}

// Update Preview
function updatePreview(){
    document.getElementById("pformName").innerText = document.getElementById("formNameInput").value;
    document.getElementById("pserialNo").innerText = document.getElementById("serialNoInput").value;
    document.getElementById("pGovTitle").innerText = document.getElementById("govTitleInput").value;
    document.getElementById("pDeptName").innerText = document.getElementById("deptNameInput").value;
    document.getElementById("pCertTitle").innerText = document.getElementById("certTitleInput").value;
    document.getElementById("ptrendmark").innerText = document.getElementById("trendmark").value;
    document.getElementById("pRegDate").innerText = document.getElementById("regDateInput").value;
    let bodyText = "Certified that the Trademark of "+document.getElementById("ownerInput").value+
        " located at "+document.getElementById("addressInput").value+
        " for services: "+document.getElementById("serviceInput").value;
    document.getElementById("pBodyText").innerText = bodyText;
    document.getElementById("pBrandName").innerText = document.getElementById("brandNameInput").value;
    document.getElementById("pSealDate").innerText = document.getElementById("sealTextInput").value + " " + document.getElementById("sealDateInput").value;
    document.getElementById("pSigName").innerText = document.getElementById("sigNameInput").value;
    document.getElementById("pSigTitle").innerText = document.getElementById("sigTitleInput").value;
    document.getElementById("pFooter").innerText = document.getElementById("footerInput").value;
}

// Logo Previews
document.getElementById("trademarkLogoInput").addEventListener("change",function(e){
    let reader = new FileReader();
    reader.onload = function(){
        document.getElementById("trademarkLogo").src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});
document.getElementById("leftLogoInput").addEventListener("change",function(e){
    let reader = new FileReader();
    reader.onload = function(){
        document.getElementById("pLeftLogo").src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});
document.getElementById("rightLogoInput").addEventListener("change",function(e){
    let reader = new FileReader();
    reader.onload = function(){
        document.getElementById("pRightLogo").src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

// PDF Download
async function downloadPDF(){
    const { jsPDF } = window.jspdf;
    html2canvas(document.getElementById("preview")).then(canvas=>{
        let img=canvas.toDataURL("image/png");
        let pdf=new jsPDF("p","mm","a4");
        pdf.addImage(img,"PNG",0,0,210,297);
        pdf.save("certificate.pdf");
    });
}
</script>

</body>
</html>
